apply plugin: 'com.android.application'

def readLocalProperty = { String key ->
    def localPropertiesFile = rootProject.file("local.properties")
    if (!localPropertiesFile.exists()) {
        return null
    }

    def localProperties = new Properties()
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
    return localProperties.getProperty(key)
}

def readBuildSecret = { String envName, String localKey ->
    def envValue = System.getenv(envName)
    if (envValue != null && envValue.trim()) {
        return envValue.trim()
    }

    def localValue = readLocalProperty(localKey)
    return localValue != null ? localValue.trim() : ""
}

def transistorBgGeoLicense = readBuildSecret("TRANSISTOR_BG_GEO_LICENSE", "transistorBgGeoLicense")

android {
    namespace = "com.raan.rider"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.raan.rider"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        manifestPlaceholders = [
            transistorBgGeoLicense: ""
        ]
    }
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    flavorDimensions "app"
    productFlavors {
        rider {
            applicationId "com.raan.rider"
            versionCode 2
            versionName "1.1"
            manifestPlaceholders = [
                transistorBgGeoLicense: ""
            ]
        }
        captain {
            applicationId "com.raan.captain"
            versionCode 2
            versionName "1.1"
            manifestPlaceholders = [
                transistorBgGeoLicense: transistorBgGeoLicense
            ]
        }
        car {
            applicationId "com.raan.car"
            versionCode 2
            versionName "1.1"
            manifestPlaceholders = [
                transistorBgGeoLicense: ""
            ]
        }
    }
    sourceSets {
        rider {
            res.srcDirs = ['src/rider/res']
        }
        captain {
            res.srcDirs = ['src/captain/res']
        }
        car {
            res.srcDirs = ['src/car/res']
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def requiresCaptainReleaseLicense = taskGraph.allTasks.any { task ->
        task.name == "assembleCaptainRelease" || task.name == "bundleCaptainRelease"
    }

    if (requiresCaptainReleaseLicense && !transistorBgGeoLicense) {
        throw new GradleException(
            "Missing Transistorsoft BGGeo license for com.raan.captain. " +
            "Set TRANSISTOR_BG_GEO_LICENSE in CI/production or " +
            "transistorBgGeoLicense in android/local.properties."
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Firebase — needed to safely initialize Firebase before PushNotifications plugin
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
